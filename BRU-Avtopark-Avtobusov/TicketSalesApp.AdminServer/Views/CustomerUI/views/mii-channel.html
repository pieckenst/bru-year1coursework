<div class="channel-view mii-channel">
  <div class="channel-header">
    <div class="channel-title">
      <h1>Mii Channel</h1>
      <p>Create and customize your Mii</p>
    </div>
  </div>

  <div class="channel-content">
    <div class="mii-showcase">
      <div class="mii-avatar-placeholder">
        <div class="mii-icon">👤</div>
        <p>Your Mii will appear here</p>
      </div>
    </div>

    <div class="mii-options">
      <div class="mii-option-card" onmouseover="hover()" onclick="select()">
        <div class="option-icon">✏️</div>
        <h3>Create Mii</h3>
        <p>Design a new Mii character</p>
      </div>
      
      <div class="mii-option-card" onmouseover="hover()" onclick="select()">
        <div class="option-icon">👥</div>
        <h3>Mii Plaza</h3>
        <p>View all your Mii characters</p>
      </div>
      
      <div class="mii-option-card" onmouseover="hover()" onclick="select()">
        <div class="option-icon">🎮</div>
        <h3>Mii Games</h3>
        <p>Play games with your Mii</p>
      </div>
    </div>

    <div class="coming-soon">
      <p>🚧 This feature is coming soon! 🚧</p>
    </div>
  </div>

  <div class="channel-footer">
    <div class="back viewchange" data-view="menu" data-transition="fade" onmouseover="hover()" onclick="back()">Back</div>
  </div>
</div>
