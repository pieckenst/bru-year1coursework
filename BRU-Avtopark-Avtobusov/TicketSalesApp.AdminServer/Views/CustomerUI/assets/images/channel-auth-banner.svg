<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ab0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d8de2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d7dd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles - spread across full canvas -->
  <circle cx="200" cy="200" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="1720" cy="880" r="200" fill="#ffffff" opacity="0.06"/>
  <circle cx="1600" cy="150" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="300" cy="900" r="120" fill="#ffffff" opacity="0.07"/>
  <circle cx="960" cy="100" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1400" cy="500" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="540" r="60" fill="#ffffff" opacity="0.06"/>
  <circle cx="1800" cy="300" r="70" fill="#ffffff" opacity="0.07"/>
  
  <!-- Center glow effect -->
  <ellipse cx="960" cy="450" rx="900" ry="500" fill="url(#glowGrad)"/>
  
  <!-- Lock icon - centered horizontally and positioned in upper third -->
  <g transform="translate(870, 200)" filter="url(#shadow)">
    <!-- Lock body -->
    <rect x="0" y="100" width="180" height="160" rx="15" fill="url(#lockGrad)" stroke="#b0b0b0" stroke-width="6"/>
    
    <!-- Lock shackle -->
    <path d="M 30 100 L 30 35 Q 30 -30 90 -30 Q 150 -30 150 35 L 150 100" 
          fill="none" stroke="url(#lockGrad)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="90" cy="160" r="24" fill="#2d7dd2"/>
    <rect x="81" y="160" width="18" height="56" fill="#2d7dd2" rx="3"/>
    
    <!-- Lock highlight -->
    <rect x="15" y="115" width="60" height="40" rx="8" fill="#ffffff" opacity="0.2"/>
  </g>
  
  <!-- Title text - positioned well below lock with ample spacing -->
  <text x="960" y="620" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">
    Authentication
  </text>
  
  <!-- Subtitle - positioned below title with proper spacing -->
  <text x="960" y="700" font-family="Arial, sans-serif" font-size="48" fill="#ffffff" opacity="0.95" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">
    Secure Access Management
  </text>
  
  <!-- Decorative line above lock -->
  <rect x="760" y="160" width="400" height="3" fill="#ffffff" opacity="0.3" rx="1.5"/>
  
  <!-- Decorative line below text -->
  <rect x="660" y="740" width="600" height="3" fill="#ffffff" opacity="0.3" rx="1.5"/>
  
  <!-- Corner accents -->
  <path d="M 100 100 L 100 200 M 100 100 L 200 100" stroke="#ffffff" stroke-width="4" opacity="0.2" stroke-linecap="round"/>
  <path d="M 1820 100 L 1820 200 M 1820 100 L 1720 100" stroke="#ffffff" stroke-width="4" opacity="0.2" stroke-linecap="round"/>
  <path d="M 100 980 L 100 880 M 100 980 L 200 980" stroke="#ffffff" stroke-width="4" opacity="0.2" stroke-linecap="round"/>
  <path d="M 1820 980 L 1820 880 M 1820 980 L 1720 980" stroke="#ffffff" stroke-width="4" opacity="0.2" stroke-linecap="round"/>
</svg>
